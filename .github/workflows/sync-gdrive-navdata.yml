# Downloads a PUBLIC Google Drive folder once per day and converts X-Plane AIRAC
# into hosted CSV for Windy. The folder URL lives in GitHub Actions Variables,
# not in the repository source. No Google password, cookie or OAuth token is used.
name: sync-gdrive-navdata
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
concurrency:
  group: navdata-updates-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GDRIVE_NAVDATA_FOLDER_URL: ${{ vars.GDRIVE_NAVDATA_FOLDER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public Drive folder downloader
        run: python -m pip install --disable-pip-version-check 'gdown==6.0.0'
      - name: Read folder, verify and convert navdata
        run: python tools/sync_gdrive_navdata.py
      - name: Commit new navigation snapshot only when data changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/navdata/points.csv public/navdata/airways.csv public/navdata/manifest.json
          if git diff --cached --quiet; then
            echo 'No changes in published navdata.'
            exit 0
          fi
          git commit -m 'Update X-Plane navdata from Google Drive'
          git push origin HEAD:main
