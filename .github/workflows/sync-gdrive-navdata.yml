name: sync-gdrive-navdata
on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive downloader
        run: python -m pip install 'gdown>=5,<6'
      - name: Download and convert navdata
        env:
          GDRIVE_NAVDATA_FOLDER_URL: ${{ vars.GDRIVE_NAVDATA_FOLDER_URL }}
        run: |
          python tools/sync_gdrive_navdata.py
          python tools/build_navdata.py
      - name: Publish generated CSV only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/navdata/manifest.json public/navdata/points.csv public/navdata/airways.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync navdata snapshot from Drive'
          git push
