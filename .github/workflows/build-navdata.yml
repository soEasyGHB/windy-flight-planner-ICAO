name: build-navdata
on:
  push:
    paths:
      - 'navdata-input/*.dat'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert uploaded navdata
        run: python tools/build_navdata.py
      - name: Publish generated files to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/navdata/manifest.json public/navdata/points.csv public/navdata/airways.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update static navigation snapshot'
          git push
